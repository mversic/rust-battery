include_guard = "battery_ffi_h"
autogen_warning = "/* Generated by cbindgen. Do not edit. */"
include_version = true
language = "C"
cpp_compat = true
usize_is_size_t = true

[parse]
parse_deps = true
include = ["co3", "rust-spec"]
exported_only = true

[parse.expand]
crates = ["battery"]
features = ["export"]
normalize_abi = true
bootstrap = true

[enum]
prefix_with_name = true

[export]
include = ["State", "Technology"]

[export.mangle]
remove_underscores = true

[export.rename]
CBoxedSliceu8 = "BatteryString"
